<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hydrogen Forum</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <!-- 引入SimpleMDE Markdown编辑器 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/simplemde/latest/simplemde.min.css">
    <script src="https://cdn.jsdelivr.net/simplemde/latest/simplemde.min.js"></script>
    <style>
        /* 重置默认样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-bo哦有
        }
        
        body {
            font-family: "Microsoft YaHei", Arial, sans-serif;
            line-height: 1.6;
        }
        
        /* 顶部导航栏 */
        .header {
            display: flex;
            align-items: center;
            padding: 10px;
            justify-content: flex-start;
        }
        
        /* 网站标题 */
        .site-title {
            font-size: 28px;
            margin-right: 20px;
            color: #333;
        }
        
        /* 导航链接 */
        .nav-links {
            display: flex;
            gap: 30px;
            margin-left: 0;
        }
        
        .nav-links a {
            text-decoration: none;
            color: #333;
            font-size: 16px;
            padding: 8px 12px;
            display: inline-block;
            vertical-align: middle;
        }
        
        .nav-links a:hover {
            color: #0066cc;
        }
        
        /* 内容区域 */
        .content {
            width: 100%;
            margin: 20px 0;
            padding: 0;
        }
        
        /* 页面标题 */
        .page-title {
            font-size: 33px;
            margin-bottom: 15px;
            word-wrap: break-word;
            overflow-wrap: break-word;
            width: 100%;
            padding-left: 40px;
        }
        
        /* 副标题 */
        h3 {
            margin-top: 20px;
            margin-bottom: 10px;
            font-size: 20px;
        }
        
        /* 列表样式 */
        ul {
            margin-left: 20px;
        }
        
        /* 段落样式 */
        p {
            margin-bottom: 10px;
        }
        
        /* 发帖按钮样式 */
        .post-btn {
            padding: 8px 12px;
            border: none;
            border-radius: 4px;
            background-color: #0066cc;
            color: white;
            font-size: 14px;
            cursor: pointer;
            display: inline-block;
            margin-bottom: 15px;
            white-space: nowrap;
            margin-left: 40px;
        }
        
        .post-btn:hover {
            background-color: #0052a3;
        }
        
        /* 发帖表单样式 */
        .post-form {
            background-color: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            display: none;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        
        .form-group input[type="text"],
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }
        
        .form-group textarea {
            min-height: 150px;
            resize: vertical;
        }
        
        .form-actions {
            text-align: right;
        }
        
        .form-actions button {
            padding: 8px 16px;
            margin-left: 10px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
        }
        
        .submit-btn {
            background-color: #4CAF50;
            color: white;
        }
        
        .cancel-btn {
            background-color: #f44336;
            color: white;
        }
        
        /* 帖子区块容器 */
        .posts-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 20px;
            width: 100%;
        }
        
        /* 响应式布局：在大屏幕上水平排列帖子区块 */
        @media screen and (min-width: 768px) {
            .posts-container {
                flex-direction: row;
                gap: 0;
                align-items: stretch;
                width: 100%;
            }
            
            .posts-section {
                flex: 1;
                display: flex;
                flex-direction: column;
                min-height: 400px;
                width: 50%;
                max-width: none;
                margin: 0;
                border-radius: 0;
            }
            
            /* 为两个模块之间添加细微的分隔线 */
            .posts-section:first-child {
                border-right: 1px solid #e0e0e0;
            }
            
            .posts-section .posts-list {
                flex: 1;
            }
        }
        
        /* 在小屏幕上优化显示 */
        @media screen and (max-width: 767px) {
            .posts-section {
                width: 100%;
                margin-bottom: 20px;
            }
        }
        
        /* 帖子列表区块 */
        .posts-section {
            background-color: #f9f9f9;
            border-radius: 0;
            padding: 30px;
            width: 100%;
            min-width: 0;
            box-sizing: border-box;
            margin: 0;
        }
        
        .section-title {
            font-size: 24px;
            margin-bottom: 15px;
            color: #333;
            border-bottom: 2px solid #0066cc;
            padding-bottom: 5px;
        }
        
        .post-item {
            border-bottom: 1px solid #eee;
            padding: 15px 0;
            width: 100%;
            box-sizing: border-box;
        }
        
        .post-item:last-child {
            border-bottom: none;
        }
        
        .post-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 5px;
            color: #333;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }
        
        .post-content {
            margin-bottom: 10px;
            color: #666;
            font-size: 14px;
            line-height: 1.5;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }
        
        .post-meta {
            font-size: 12px;
            color: #999;
        }

        /* 添加倒计时数字样式 */
        .countdown-number {
            color: orange;
        }
    </style>
</head>

<body>
    <!-- 顶部导航栏 -->
    <header class="header">
        <div class="site-title"><i class="fa fa-comments"></i> Hydrogen Forum</div>
        <nav class="nav-links">
            <a href="./所有文章.html">所有文章</a>
            <a href="./announcement.html">公告</a>
            <a href="./about.html">关于氢论坛</a>
            <span id="userStatus">未登录 | <a href="./login.html">登录</a></span>
        </nav>
    </header>
    
    <!-- 内容区域 -->
        <main class="content">
            <div class="page-title">
                <span>欢迎来到Hydrogen Forum</span>
            </div>
            
            <!-- 春季倒计时 -->
            <div class="countdown" style="font-size: 18px; color: #666; margin-left: 40px; margin-bottom: 15px;">
                <span id="springFestivalCountdown" style="font-weight: bold;">2026年春节倒计时: </span>
            </div>
            
            <!-- 发帖按钮 -->
            <button id="postBtn" class="post-btn">发帖</button>
            
            <!-- 帖子区块容器 -->
            <div class="posts-container">
                <!-- 最新帖子区块 -->
                <div class="posts-section">
                    <h2 class="section-title">最新帖子</h2>
                    <div class="posts-list" id="latestPosts">
                        <!-- 最新帖子将通过JavaScript动态添加 -->
                    </div>
                </div>
                
                <!-- 最热帖子区块 -->
                <div class="posts-section">
                    <h2 class="section-title">最热帖子</h2>
                    <div class="posts-list" id="hotPosts">
                        <!-- 最热帖子将通过JavaScript动态添加 -->
                    </div>
                </div>
            </div>
    </main>
    
    <!-- 引入论坛核心功能JavaScript -->
    <script src="./js/forum.js"></script>
    <script>
        // 页面加载时的初始化
        window.onload = function() {
            checkLoginStatus();
            displayLatestPosts();
            displayHotPosts();
            startSpringFestivalCountdown(); // 添加倒计时初始化
        };
        
        // 春季倒计时功能
        function startSpringFestivalCountdown() {
            const countdownElement = document.getElementById('springFestivalCountdown');
            if (!countdownElement) return;
            
            const springFestival = new Date('2026-02-17T00:00:00');
            
            function updateCountdown() {
                const now = new Date();
                const diff = springFestival - now;
                
                if (diff <= 0) {
                    countdownElement.innerHTML = '<span class="countdown-number">2026愿你"策马扬鞭"再奋蹄，"一马当先"创佳绩</span>';
                    return;
                }
                
                const days = Math.floor(diff / (1000 * 60 * 60 * 24));
                const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((diff % (1000 * 60)) / 1000);
                
                countdownElement.innerHTML = `2026年春节倒计时: <span class="countdown-number">${days}天 ${hours}时 ${minutes}分 ${seconds}秒</span>`;
            }
            
            // 立即更新一次
            updateCountdown();
            // 每秒更新一次
            setInterval(updateCountdown, 1000);
        }
        
        // 发帖按钮点击事件
        document.addEventListener('DOMContentLoaded', function() {
            const postBtn = document.getElementById('postBtn');
            if (postBtn) {
                postBtn.addEventListener('click', function() {
                    // 跳转到发帖页面
                    window.location.href = './发帖.html';
                });
            }
        });
        
        // 显示最新帖子
        function displayLatestPosts() {
            const latestPostsList = document.getElementById('latestPosts');
            latestPostsList.innerHTML = '';
            
            // 从本地存储获取帖子
            let posts = getAllPosts();
            
            // 按发布时间降序排序
            const sortedPosts = [...posts].sort((a, b) => b.id - a.id);
            
            if (sortedPosts.length === 0) {
                latestPostsList.innerHTML = '<p style="text-align: center; color: #999; margin-top: 20px;">暂无帖子</p>';
                return;
            }
            
            // 只显示最新的3个帖子
            const latest3Posts = sortedPosts.slice(0, 3);
            
            latest3Posts.forEach(post => {
                createPostElement(post, latestPostsList);
            });
        }
        
        // 显示最热帖子
        function displayHotPosts() {
            const hotPostsList = document.getElementById('hotPosts');
            hotPostsList.innerHTML = '';
            
            // 从本地存储获取帖子
            let posts = getAllPosts();
            
            // 按创建时间排序（暂时用这个作为热度指标）
            const sortedPosts = [...posts].sort((a, b) => b.id - a.id);
            
            if (sortedPosts.length === 0) {
                hotPostsList.innerHTML = '<p style="text-align: center; color: #999; margin-top: 20px;">暂无帖子</p>';
                return;
            }
            
            // 只显示最新的3个帖子
            const hot3Posts = sortedPosts.slice(0, 3);
            
            hot3Posts.forEach(post => {
                createPostElement(post, hotPostsList);
            });
        }
        
        // 创建帖子元素
        function createPostElement(post, container) {
            const postItem = document.createElement('div');
            postItem.className = 'post-item';
            
            // 简单的Markdown转义
            let formattedContent = post.content;
            // 粗体
            formattedContent = formattedContent.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            // 斜体
            formattedContent = formattedContent.replace(/\*(.*?)\*/g, '<em>$1</em>');
            // 换行
            formattedContent = formattedContent.replace(/\n/g, '<br>');
            
            // 截断内容，只显示部分
            const truncatedContent = formattedContent.length > 100 
                ? formattedContent.substring(0, 100) + '...' 
                : formattedContent;
            
            postItem.innerHTML = `
                <div class="post-title"><a href="./view-post.html?id=${post.id}" style="color: #333; text-decoration: none;">${post.title}</a></div>
                <div class="post-content">${truncatedContent}</div>
                <div class="post-meta">
                    作者：${post.author} | 发布时间：${post.createdAt}
                </div>
            `;
            
            container.appendChild(postItem);
        }
    </script>
</body>

</html>
