<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>发帖 - Hydrogen Forum</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <!-- 引入SimpleMDE Markdown编辑器 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/simplemde/latest/simplemde.min.css">
    <script src="https://cdn.jsdelivr.net/simplemde/latest/simplemde.min.js"></script>
    <style>
        /* 重置默认样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: "Microsoft YaHei", Arial, sans-serif;
            line-height: 1.6;
        }
        
        /* 顶部导航栏 */
        .header {
            display: flex;
            align-items: center;
            padding: 10px;
        }
        
        /* 网站标题 */
        .site-title {
            font-size: 28px;
            margin-right: 20px;
            color: #333;
        }
        
        /* 导航链接 */
        .nav-links {
            display: flex;
            gap: 20px;
        }
        
        .nav-links a {
            text-decoration: none;
            color: #333;
            font-size: 16px;
        }
        
        .nav-links a:hover {
            color: #0066cc;
        }
        
        /* 内容区域 */
        .content {
            width: 100%;
            max-width: 1200px;
            margin: 20px 0;
            padding: 0 20px;
        }
        
        /* 页面标题 */
        .page-title {
            font-size: 33px;
            margin-bottom: 15px;
        }
        
        /* 副标题 */
        h3 {
            margin-top: 20px;
            margin-bottom: 10px;
            font-size: 20px;
        }
        
        /* 段落样式 */
        p {
            margin-bottom: 10px;
        }
        
        /* 发帖表单样式 */
        .post-form {
            background-color: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        
        .form-group input[type="text"],
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }
        
        .form-group textarea {
            min-height: 200px;
            resize: vertical;
        }
        
        .form-actions {
            text-align: right;
        }
        
        .form-actions button {
            padding: 8px 16px;
            margin-left: 10px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
        }
        
        .submit-btn {
            background-color: #0066cc;
            color: white;
        }
        
        .cancel-btn {
            background-color: #f44336;
            color: white;
        }
    </style>
</head>
<body>
    <!-- 顶部导航栏 -->
    <header class="header">
        <div class="site-title"><i class="fa fa-comments"></i> Hydrogen Forum</div>
        <nav class="nav-links">
            <a href="./index.html">回到首页</a>
            <a href="./所有文章.html">所有文章</a>
            <a href="./announcement.html">公告</a>
            <a href="./about.html">关于</a>
            <a href="./login.html">登录</a>
        </nav>
    </header>
    
    <!-- 内容区域 -->
    <main class="content">
        <div class="page-title">
            <span>发布新帖子</span>
        </div>
        
        <!-- 发帖表单 -->
        <div class="post-form">
            <form id="postForm">
                <div class="form-group">
                    <label for="postTitle">标题</label>
                    <input type="text" id="postTitle" placeholder="请输入帖子标题" required>
                </div>
                
                <div class="form-group">
                    <label for="postContent">内容 (支持Markdown格式)</label>
                    <textarea id="postContent" placeholder="请输入帖子内容，支持Markdown格式" required></textarea>
                </div>
                

                
                <div class="form-actions">
                    <button type="button" class="cancel-btn" onclick="cancelPost()">取消</button>
                    <button type="button" class="submit-btn" onclick="submitPost()">发布</button>
                </div>
            </form>
        </div>
    </main>
    
    <script>
        // 全局变量 - markdown编辑器实例
        let simplemde;
        
        // 页面加载时初始化编辑器
        window.onload = function() {
            // 确保DOM元素加载完成后再初始化编辑器
            setTimeout(function() {
                try {
                    // 初始化SimpleMDE编辑器
                    simplemde = new SimpleMDE({
                        element: document.getElementById("postContent"),
                        autosave: {
                            enabled: true,
                            uniqueId: "hydrogen-forum-post",
                            delay: 1000,
                        },
                        spellChecker: false,
                        toolbar: [
                            "bold", "italic", "strikethrough", "heading", "|",
                            "code", "quote", "unordered-list", "ordered-list", "|",
                            "link", "image", "|",
                            "side-by-side", "fullscreen", "|",
                            "guide"
                        ],
                        placeholder: "请输入帖子内容，支持Markdown格式..."
                    });
                    
                    console.log('Markdown编辑器初始化成功');
                } catch (error) {
                    console.error('Markdown编辑器初始化失败:', error);
                    // 如果编辑器初始化失败，使用原生textarea
                    simplemde = null;
                }
            }, 100);
        };
        
        // 提交帖子
        function submitPost() {
            // 检查用户是否已登录
            const currentUser = JSON.parse(localStorage.getItem('hydrogenCurrentUser'));
            if (!currentUser) {
                alert('请先登录后再发帖！');
                window.location.href = './login.html';
                return;
            }
            
            const title = document.getElementById('postTitle').value;
            
            // 获取编辑器内容
            const content = simplemde ? simplemde.value() : document.getElementById('postContent').value;
            
            // 表单验证
            if (!title || !content) {
                alert('请填写标题和内容');
                return;
            }
            
            // 使用当前登录用户的用户名
            const author = currentUser.username;
            
            // 创建新帖子对象
            const newPost = {
                id: Date.now(), // 使用时间戳作为唯一ID
                title: title,
                content: content,
                author: author,
                createdAt: new Date().toLocaleString(),
                views: 0,
                likes: 0
            };
            
            // 从本地存储获取现有帖子
            let posts = JSON.parse(localStorage.getItem('hydrogenPosts') || '[]');
            
            // 添加新帖子
            posts.push(newPost);
            
            // 保存到本地存储
            localStorage.setItem('hydrogenPosts', JSON.stringify(posts));
            
            // 发布成功后跳转
            alert('帖子发布成功！');
            window.location.href = './所有文章.html';
        }
        
        // 取消发帖
        function cancelPost() {
            // 跳转到首页
            window.location.href = './index.html';
        }
    </script>
</body>
</html>
