<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <style>
        /* 重置默认样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: "Microsoft YaHei", Arial, sans-serif;
            line-height: 1.6;
        }
        
        /* 顶部导航栏 */
        .header {
            display: flex;
            align-items: center;
            padding: 10px;
        }
        
        .site-title {
            font-size: 28px;
            margin-right: 20px;
            color: #333;
        }
        
        .nav-links {
            display: flex;
            gap: 20px;
        }
        
        .nav-links a {
            text-decoration: none;
            color: #333;
            font-size: 16px;
        }
        
        .nav-links a:hover {
            color: #0066cc;
        }
        
        /* 表单样式 */
        .main {
            margin-bottom: 20px;
        }

        .main form {
            text-align: center;
        }

        .main input {
            width: 100%;
            padding: 8px 10px;
            margin: 8px 0;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }

        .main i {
            margin-right: 8px;
            color: #666;
        }

        /* 按钮样式 */
        button {
            padding: 8px 16px;
            margin: 0 10px;
            border: none;
            border-radius: 7px;
            background-color: #346be2;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <!-- 顶部导航栏 -->
    <header class="header">
        <div class="site-title"><i class="fa fa-comments"></i> Hydrogen Forum</div>
        <nav class="nav-links">
            <a href="./index.html">回到首页</a>
            <a href="./所有文章.html">所有文章</a>
            <a href="./announcement.html">公告</a>
            <a href="./about.html">关于</a>
            <a href="./login.html">登录</a>
        </nav>
    </header>
    
    <div class="container">
        <div class="header">
            <h1>注册</h1>
        </div>
    </div>
    <div class="main">
        <form id="registerForm">
            <span>
                <i class="fa fa-user"></i>
                <input type="text" placeholder="用户名" id="username">
                <br>
                <i class="fa fa-lock"></i>
                <input type="password" placeholder="密码" id="password">
                <br>
                <i class="fa fa-lock"></i>
                <input type="password" placeholder="确认密码" id="confirmPassword">
            </span>
        </form>
    </div>
    <div class="login-actions">
        <button type="button" onclick="register()">注册</button>
        <button type="button" onclick="goToLogin()">登录</button>
    </div>

    <div class="home-link">
    </div>
    
    <script>
        function goToLogin() {
            window.location.href = './login.html';
        }
        
        function register() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            // 简单验证
            if (!username || !password || !confirmPassword) {
                alert('请填写所有字段');
                return;
            }
            
            if (password !== confirmPassword) {
                alert('两次输入的密码不一致');
                return;
            }
            
            // 简单的注册功能，后续可以添加实际的注册逻辑
            alert('注册功能正在开发中');
            // 如果需要跳转到登录页面，可以取消下面的注释
            // window.location.href = './login.html';
        }
    </script>
</body>
</html>
