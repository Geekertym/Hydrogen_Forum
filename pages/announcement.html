<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Announcement</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <style>
        /* 重置默认样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: "Microsoft YaHei", Arial, sans-serif;
            line-height: 1.6;
        }
        
        /* 顶部导航栏 */
        .header {
            display: flex;
            align-items: center;
            padding: 10px;
        }
        
        /* 网站标题 */
        .site-title {
            font-size: 28px;
            margin-right: 20px;
            color: #333;
        }
        
        /* 导航链接 */
        .nav-links {
            display: flex;
            gap: 30px;
        }
        
        .nav-links a {
            text-decoration: none;
            color: #333;
            font-size: 16px;
        }
        
        .nav-links a:hover {
            color: #0066cc;
        }
        
        /* 内容区域 */
        .content {
            width: 100%;
            max-width: 1200px;
            margin: 20px 0;
            padding: 0 20px;
        }
        
        /* 页面标题 */
        .page-title {
            font-size: 33px;
            margin-bottom: 20px;
        }
        
        /* 副标题 */
        h3 {
            margin-top: 20px;
            margin-bottom: 10px;
            font-size: 20px;
        }
        
        /* 列表样式 */
        ul {
            margin-left: 20px;
        }
        
        /* 段落样式 */
        p {
            margin-bottom: 10px;
        }
    </style>
</head>

<body>
    <!-- 顶部导航栏 -->
    <header class="header">
        <div class="site-title"><i class="fa fa-comments"></i> Hydrogen Forum</div>
        <nav class="nav-links">
            <a href="./index.html">回到主页</a>
            <a href="./所有文章.html">所有文章</a>
            <a href="./about.html">关于</a>
            <span id="userStatus">未登录 | <a href="./login.html">登录</a></span>
        </nav>
    </header>
    
    <!-- 内容区域 -->
    <main class="content">
        <div class="page-title">
            <span>Hydrogen Announcement(氢公告)</span>
        </div>
        
        <p>这里是氢论坛的公告区域。</p>
        <p>请在此查看最新的论坛公告和重要信息。</p>

        <!-- 新增：发公告按钮 -->
        <button id="btnNewAnnounce" style="margin-top:20px;background:#0066cc;color:#fff;border:none;padding:8px 16px;border-radius:4px;cursor:pointer;">发公告</button>
        
        <!-- 新增：公告列表区域 -->
        <div id="announcementList" style="margin-top:30px;">
            <!-- 公告将通过JavaScript动态加载 -->
        </div>

    </main>
    
    <script>
        // 新增：加载并显示公告
        function loadAnnouncements() {
            const announcements = JSON.parse(localStorage.getItem('hydrogenAnnouncements') || '[]');
            const announcementList = document.getElementById('announcementList');
            
            // 按日期降序排序
            announcements.sort((a, b) => new Date(b.date) - new Date(a.date));
            
            if (announcements.length === 0) {
                announcementList.innerHTML = '<p>暂无公告</p>';
                return;
            }
            
            let html = '';
            announcements.forEach(announcement => {
                const date = new Date(announcement.date).toLocaleString();
                html += `
                <div style="border:1px solid #ddd;border-radius:8px;padding:20px;margin-bottom:20px;">
                    <h3 style="margin-bottom:10px;">${announcement.title}</h3>
                    <div style="color:#666;margin-bottom:10px;">发布者: ${announcement.author} | 发布时间: ${date}</div>
                    <div class="announcement-content">${marked.parse(announcement.content)}</div>
                </div>
                `;
            });
            
            announcementList.innerHTML = html;
        }
        
        // 检查用户登录状态
        function checkLoginStatus() {
            const currentUser = JSON.parse(localStorage.getItem('hydrogenCurrentUser'));
            const userStatus = document.getElementById('userStatus');
            const btnNewAnnounce = document.getElementById('btnNewAnnounce');
            
            if (currentUser && userStatus) {
                // 用户已登录
                userStatus.innerHTML = `${currentUser.username} | <a href="javascript:logout()">登出</a>`;
                // 显示发公告按钮（这里可以根据实际需求添加权限控制）
                if (btnNewAnnounce) {
                    btnNewAnnounce.style.display = 'block';
                }
            } else {
                // 用户未登录，隐藏发公告按钮
                if (btnNewAnnounce) {
                    btnNewAnnounce.style.display = 'none';
                }
            }
        }
        
        // 登出功能
        function logout() {
            localStorage.removeItem('hydrogenCurrentUser');
            window.location.reload(); // 刷新页面
        }
        
        // 跳转到发布公告页面
        function goToNewAnnouncement() {
            window.location.href = './new-announcement.html';
        }
        
        // 页面加载时检查登录状态并加载公告
        window.onload = function() {
            checkLoginStatus();
            // 绑定按钮点击事件
            const btnNewAnnounce = document.getElementById('btnNewAnnounce');
            if (btnNewAnnounce) {
                btnNewAnnounce.addEventListener('click', goToNewAnnouncement);
            }
            // 加载公告
            loadAnnouncements();
        };
    </script>
    <!-- 引入marked.js用于Markdown渲染 -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</body>

</html>
